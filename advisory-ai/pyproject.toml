[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "advisory-ai"
version = "0.1.0"
description = "Advisory AI - 5 lens agents that critique your ideas like world-class advisors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Anup Sahoo", email = "anup@anupsahoo.dev" }
]
keywords = ["ai", "agents", "critique", "business", "strategy", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "ollama>=0.1.7",
    "openai>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
advisory = "advisory.cli:app"

[project.urls]
Homepage = "https://github.com/anupsahoo/advisory-ai"
Documentation = "https://github.com/anupsahoo/advisory-ai#readme"
Repository = "https://github.com/anupsahoo/advisory-ai"
Issues = "https://github.com/anupsahoo/advisory-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/advisory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
